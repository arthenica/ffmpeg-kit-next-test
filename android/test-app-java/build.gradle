import com.android.build.api.variant.FilterConfiguration

apply plugin: 'com.android.application'

android {
    signingConfigs {
        localConfig {
            keyAlias 'androiddebugkey'
            storeFile file(System.getProperty("user.home") + '/.android/debug.keystore')
            storePassword 'android'
            keyPassword 'android'
        }
    }
    if (project.android.hasProperty("namespace")) {
        namespace 'com.arthenica.ffmpegkit.test'
    }
    compileSdk 34
    defaultConfig {
        applicationId "com.arthenica.ffmpegkit.test"
        minSdk 24
        targetSdk 35
        versionCode 240811
        versionName "8.1.1"
    }
    buildTypes {
        debug {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.localConfig
        }
    }
    splits {
        abi {
            enable true
            reset()
            include "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
            universalApk false
        }
    }
}

ext.abiCodes = ['x86': 1, 'x86_64': 2, 'armeabi-v7a': 3, 'arm64-v8a': 4]

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def abi = output.filters.find { it.filterType == FilterConfiguration.FilterType.ABI }?.identifier
            def baseAbiVersionCode = project.ext.abiCodes.get(abi)
            if (baseAbiVersionCode != null) {
                output.versionCode.set(baseAbiVersionCode + output.versionCode.get())
            }
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.2.21')
    implementation 'com.arthenica:ffmpeg-kit-next:8.1.0'
    implementation 'com.arthenica:smart-exception-java:0.2.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    testImplementation 'junit:junit:4.13.2'
}
