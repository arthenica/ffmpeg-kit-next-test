name: ffmpeg_kit_flutter_test
description: Demonstrates how to use the ffmpeg_kit_flutter plugin.
version: 7.1.0
publish_to: none

environment:
  sdk: ">=2.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  ffmpeg_kit_next_flutter:
    path: ../../../ffmpeg-kit-next/flutter/flutter
  cupertino_icons: ^1.0.9
  path_provider: ^2.1.6
  path: ^1.9.1
  fluttertoast: 9.1.0
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/
